name: Game bug report
description: Report a problem in a packaged Windows playtest.
title: "[9596] "
body:
  - type: input
    id: build
    attributes:
      label: Build number
      placeholder: "9596"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area or level
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: List the steps that led to the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, video and logs
      description: Attach useful evidence. Logs are in UserData/Saved/Logs. Remove personal information before posting publicly.
